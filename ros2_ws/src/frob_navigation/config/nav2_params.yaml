# =====================================================================
#       NAV2 PARAMETERS - SMOOTH TANK TURNS WITHOUT JERKS
# =====================================================================

# ========================================
#            AMCL - ЛОКАЛИЗАЦИЯ
# ========================================
amcl:
  ros__parameters:
    use_sim_time: False
    
    # Фреймы координат
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Публикация и инициализация
    tf_broadcast: true
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose_topic: "initialpose"
    scan_topic: "/scan"
    
    # Модель движения робота
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    # Параметры шума движения
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.1
    
    # Фильтр частиц
    max_particles: 2500
    min_particles: 600
    pf_err: 0.03
    pf_z: 0.99
    
    # Частота обновления
    update_min_d: 0.08
    update_min_a: 0.15
    resample_interval: 1
    
    # Параметры лазера
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    
    # Модель сенсора
    z_hit: 0.6
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.25
    sigma_hit: 0.2
    lambda_short: 0.1
    
    # Допустимые задержки
    transform_tolerance: 1.0

# ========================================
#         BT NAVIGATOR - ПОВЕДЕНИЕ
# ========================================
bt_navigator:
  ros__parameters:
    use_sim_time: False
    
    # Фреймы и топики
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    
    # Временные параметры
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.5
    
    # Навигаторы
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

# ========================================
#     CONTROLLER SERVER - УПРАВЛЕНИЕ
# ========================================
controller_server:
  ros__parameters:
    use_sim_time: False
    
    # Основные параметры
    controller_frequency: 10.0
    odom_topic: "/odom"
    
    # Пороги скоростей
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    
    # Таймауты и допуски
    costmap_update_timeout: 0.3
    failure_tolerance: 1.0
    action_server_result_timeout: 10.0
    transform_tolerance: 0.5
    
    # Плагины
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 25.0
    
    # Stopped Goal Checker
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      stateful: True
      rot_stopped_velocity: 0.10
      trans_stopped_velocity: 0.10
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.50
    
    # ===== РЕГУЛИРУЕМЫЙ PURE PURSUIT - ПЛАВНЫЕ ТАНКОВЫЕ РАЗВОРОТЫ =====
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # ===== БАЗОВЫЕ СКОРОСТИ =====
      desired_linear_vel: 0.25
      
      # ===== LOOKAHEAD =====
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      
      # ===== ТАНКОВЫЕ РАЗВОРОТЫ - ВКЛЮЧЕНЫ НО ПЛАВНЫЕ! =====
      use_rotate_to_heading: true               # ВКЛЮЧЕНО!
      rotate_to_heading_min_angle: 0.785        # 45° - умеренно
      rotate_to_heading_angular_vel: 0.5        # МЕДЛЕННО! Было 0.6
      max_angular_accel: 1.5                    # ПЛАВНОЕ ускорение! Было 2.0
      
      # ===== МАСШТАБИРОВАНИЕ СКОРОСТИ =====
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.0
      approach_velocity_scaling_dist: 1.0
      
      # ===== ОБНАРУЖЕНИЕ КОЛЛИЗИЙ =====
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      
      # ===== РЕГУЛИРОВАНИЕ НА ПОВОРОТАХ =====
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.12
      
      # ===== ПАРАМЕТРЫ COSTMAP =====
      cost_scaling_dist: 0.5
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 2.0
      
      # ===== ЗАПРЕТ ДВИЖЕНИЯ НАЗАД =====
      allow_reversing: false
      max_robot_pose_search_dist: 2.0
      
      # ===== ИНТЕРПОЛЯЦИЯ =====
      use_interpolation: true
      transform_tolerance: 0.2

# ========================================
#        LOCAL COSTMAP - ЛОКАЛЬНАЯ
# ========================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      
      # Частота обновления
      update_frequency: 5.0
      publish_frequency: 5.0
      
      # Фреймы и размеры
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.14
      footprint_padding: 0.0
      
      # Rolling window
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      
      transform_tolerance: 0.5
      
      # Слои карты
      plugins: ["obstacle_layer", "inflation_layer"]
      
      # Obstacle Layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
          inf_is_valid: false
      
      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========================================
#       GLOBAL COSTMAP - ГЛОБАЛЬНАЯ
# ========================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      
      # Частота обновления
      update_frequency: 1.0
      publish_frequency: 1.0
      
      # Фреймы и размеры
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.14
      footprint_padding: 0.0
      
      # Параметры карты
      resolution: 0.05
      track_unknown_space: true
      
      transform_tolerance: 1.0
      
      # Слои карты
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # Static Layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      # Obstacle Layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
          inf_is_valid: false
      
      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========================================
#      PLANNER SERVER - ПЛАНИРОВАНИЕ
# ========================================
planner_server:
  ros__parameters:
    use_sim_time: False
    
    # Частота планирования
    expected_planner_frequency: 20.0
    
    # Плагины планировщиков
    planner_plugins: ["GridBased"]
    
    # NavFn Planner
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false              # Dijkstra для более плавных путей
      allow_unknown: true

# ========================================
#    SMOOTHER SERVER - УСИЛЕННОЕ СГЛАЖИВАНИЕ
# ========================================
smoother_server:
  ros__parameters:
    use_sim_time: False
    
    # Частота сглаживания
    smoother_frequency: 20.0
    
    # Плагины
    smoother_plugins: ["simple_smoother"]
    
    # ===== SIMPLE SMOOTHER - МАКСИМАЛЬНОЕ СГЛАЖИВАНИЕ =====
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      
      # ПАРАМЕТРЫ СГЛАЖИВАНИЯ
      tolerance: 1.0e-10
      max_its: 3000                        # МНОГО итераций!
      do_refinement: True
      
      # ===== ВЕСА - КРИТИЧНО ДЛЯ ПЛАВНОСТИ! =====
      w_data: 0.1                          # Слабая привязка к исходному пути
      w_smooth: 0.5                        # СИЛЬНОЕ сглаживание!

# ========================================
#   BEHAVIOR SERVER - ВОССТАНОВЛЕНИЕ
# ========================================
behavior_server:
  ros__parameters:
    use_sim_time: False
    
    # Топики costmap
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    
    # Частота и фреймы
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    
    # Симуляция движения
    simulate_ahead_time: 2.0
    
    # Лимиты движения
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
    
    # Плагины поведений
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.5              # МЕДЛЕННЕЕ!
      min_rotational_vel: 0.3
      rotational_acc_lim: 1.5              # ПЛАВНЕЕ!
      
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
      backup_dist: 0.25
      backup_speed: 0.15
      time_allowance: 10.0
      
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      
    wait:
      plugin: "nav2_behaviors::Wait"

# ========================================
#    WAYPOINT FOLLOWER - ТОЧКИ МАРШРУТА
# ========================================
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    
    # Параметры следования
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 10.0
    
    # Плагины задач
    waypoint_task_executor_plugin: "wait_at_waypoint"
    
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ========================================
#   VELOCITY SMOOTHER - СГЛАЖИВАНИЕ CMD_VEL
# ========================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    
    # Частота и режим
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # Топики
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    odom_topic: "/odom"
    odom_duration: 0.1
    
    # Лимиты скоростей [x, y, theta]
    max_velocity: [0.30, 0.0, 0.7]         # Угловая чуть снижена
    min_velocity: [-0.01, 0.0, -0.7]
    
    # Ускорения [x, y, theta] - ПЛАВНЕЕ!
    max_accel: [1.2, 0.0, 1.5]             # УМЕНЬШЕНЫ для плавности!
    max_decel: [-1.5, 0.0, -1.5]           # УМЕНЬШЕНЫ!
    
    # Мертвая зона
    deadband_velocity: [0.01, 0.0, 0.02]
    
    # Таймаут
    velocity_timeout: 0.2

# ========================================
#   COLLISION MONITOR - БЕЗОПАСНОСТЬ
# ========================================
collision_monitor:
  ros__parameters:
    use_sim_time: False
    
    # Фреймы
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    
    # Топики
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    
    # Параметры безопасности
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 0.1
    
    # Зоны безопасности
    polygons: ["StopZone", "SlowdownZone"]
    
    # Зона экстренной остановки
    StopZone:
      type: "circle"
      action_type: "stop"
      radius: 0.06
      visualize: True
      enabled: True
      min_points: 8
      
    # Зона замедления
    SlowdownZone:
      type: "circle"
      action_type: "slowdown"
      radius: 0.12
      slowdown_ratio: 0.8
      visualize: True
      enabled: True
      min_points: 3
    
    # Источники данных
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True

# ========================================
#     MAP SERVER - СЕРВЕР КАРТЫ
# ========================================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ========================================
#    LIFECYCLE MANAGERS - УПРАВЛЕНИЕ
# ========================================

# Менеджер локализации
lifecycle_manager_localization:
  ros__parameters:
    autostart: True
    node_names:
      - map_server
      - amcl

# Менеджер навигации
lifecycle_manager_navigation:
  ros__parameters:
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor

