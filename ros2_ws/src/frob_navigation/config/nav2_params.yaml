# =====================================================================
# Nav2 Parameters for Frob Robot - FIX TF ISSUES
# =====================================================================

# ========== LOCALIZATION (AMCL) ==========
amcl:
  ros__parameters:
    use_sim_time: False  # ← УБЕДИСЬ ЧТО ЭТО False ВЕЗДЕ!
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    # Шум модели движения
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    
    # Частицы
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    
    # Обновление
    update_min_d: 0.1
    update_min_a: 0.2
    resample_interval: 1
    
    # Лазер
    scan_topic: /scan
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    
    # ✅ TF - УВЕЛИЧЕНО!
    tf_broadcast: true
    transform_tolerance: 2.0  # ← Было 1.0, увеличено до 2.0!
    
    # Модель лазера
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

# ========== BT NAVIGATOR ==========
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    
    # ✅ ДОБАВЛЕНО: transform_tolerance
    transform_tolerance: 2.0
    
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

# ========== CONTROLLER SERVER ==========
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    odom_topic: "/odom"
    
    # Пороги движения
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    
    # ✅ УВЕЛИЧЕНО: tolerances
    costmap_update_timeout: 1.0  # ← Было 0.30, увеличено
    failure_tolerance: 0.5
    speed_limit_topic: "speed_limit"

    # Плагины
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0  # ← Увеличено с 10.0
    
    # Goal Checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    
    # Regulated Pure Pursuit
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # Основные параметры
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      
      # Вращение к цели
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 2.0  # ← УВЕЛИЧЕНО!
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.8
      
      # Обнаружение столкновений
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      
      # Регулирование скорости
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      
      # Вращение на месте
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      
      # Другое
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

# ========== LOCAL COSTMAP ==========
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      
      # Частота обновления
      update_frequency: 5.0
      publish_frequency: 5.0
      
      # Фреймы
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.15
      
      # Rolling window
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      
      # ✅ TF tolerance увеличен
      transform_tolerance: 2.0  # ← Было 0.5
      
      # Слои
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
      
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========== GLOBAL COSTMAP ==========
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      
      # Частота
      update_frequency: 1.0
      publish_frequency: 1.0
      
      # Фреймы
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.15
      
      # Параметры карты
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 2.0  # ← УВЕЛИЧЕНО!
      
      # Слои
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_min_range: 0.20
          obstacle_min_range: 0.20
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========== MAP SERVER ==========
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ========== PLANNER SERVER ==========
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ========== SMOOTHER SERVER ==========
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ========== BEHAVIOR SERVER ==========
behavior_server:
  ros__parameters:
    use_sim_time: False
    
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 2.0  # ← УВЕЛИЧЕНО
    simulate_ahead_time: 2.0
    
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.5

# ========== WAYPOINT FOLLOWER ==========
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ========== VELOCITY SMOOTHER ==========
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    cmd_vel_out_topic: "cmd_vel_smoothed"
    odom_topic: "/odom"
    odom_duration: 0.1
    
    max_velocity: [0.30, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.5]
    max_decel: [-2.0, 0.0, -2.5]
    
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

# ========== COLLISION MONITOR ==========
collision_monitor:
  ros__parameters:
    use_sim_time: False
    
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    
    # ✅ УВЕЛИЧЕНЫ tolerances для source
    transform_tolerance: 2.0  # ← Было 0.2
    source_timeout: 5.0       # ← Было 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    
    polygons: ["FootprintApproach"]
    
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# ========== DOCKING SERVER ==========
docking_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0

# ========== LIFECYCLE MANAGERS ==========
lifecycle_manager_localization:
  ros__parameters:
    autostart: True
    node_names:
      - map_server
      - amcl

lifecycle_manager_navigation:
  ros__parameters:
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor