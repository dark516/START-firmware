          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
          inf_is_valid: false
      
      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========================================
#       GLOBAL COSTMAP - ГЛОБАЛЬНАЯ
# ========================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      
      # Частота обновления
      update_frequency: 1.0
      publish_frequency: 1.0
      
      # Фреймы и размеры
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.14
      footprint_padding: 0.0
      
      # Параметры карты
      resolution: 0.05
      track_unknown_space: true
      
      transform_tolerance: 1.0
      
      # Слои карты
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # Static Layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      # Obstacle Layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
          inf_is_valid: false
      
      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0
      
      always_send_full_costmap: True

# ========================================
#      PLANNER SERVER - ПЛАНИРОВАНИЕ
# ========================================
planner_server:
  ros__parameters:
    use_sim_time: False
    
    # Частота планирования
    expected_planner_frequency: 20.0
    
    # ===== ИСПОЛЬЗУЕМ SMAC PLANNER 2D - ПЛАВНЫЕ ПУТИ! =====
    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      
      # ===== ОСНОВНЫЕ ПАРАМЕТРЫ =====
      tolerance: 0.25                       # Допуск цели
      downsample_costmap: false             # Не упрощать costmap
      downsampling_factor: 1                # Фактор упрощения
      
      # ===== ПАРАМЕТРЫ ПОИСКА =====
      allow_unknown: true                   # Разрешить неизвестные области
      max_iterations: 1000000               # Макс. итераций A*
      max_on_approach_iterations: 1000      # Итераций у цели
      max_planning_time: 5.0                # Макс. время планирования (сек)
      
      # ===== ПАРАМЕТРЫ ДВИЖЕНИЯ =====
      motion_model_for_search: "DUBIN"      # Модель Дубина - плавные дуги!
      angle_quantization_bins: 72           # Разрешение углов (каждые 5°)
      
      # ===== АНАЛИТИЧЕСКОЕ РАСШИРЕНИЕ - ПЛАВНОСТЬ! =====
      analytic_expansion_ratio: 3.5         # Использовать аналитику
      analytic_expansion_max_length: 3.0    # Макс. длина расширения
      reverse_penalty: 2.0                  # Штраф за движение назад
      change_penalty: 0.0                   # Штраф за смену направления
      non_straight_penalty: 1.2             # Штраф за повороты
      cost_penalty: 2.0                     # Штраф за стоимость
      retrospective_penalty: 0.015          # Ретроспективный штраф
      
      # ===== РАДИУС ПОВОРОТА =====
      minimum_turning_radius: 0.20          # Минимальный радиус (м)
      
      # ===== ПАРАМЕТРЫ КЕША =====
      cache_obstacle_heuristic: false
      allow_primitive_interpolation: false
      
      # ===== SMOOTHER ВКЛЮЧЕН В ПЛАНИРОВЩИКЕ! =====
      smooth_path: true                     # ВКЛЮЧИТЬ внутреннее сглаживание!
      
      # ===== DEBUG =====
      debug_visualizations: false

# ========================================
#    SMOOTHER SERVER - СГЛАЖИВАНИЕ ПУТИ
# ========================================
# ========================================
#    SMOOTHER SERVER - СГЛАЖИВАНИЕ ПУТИ
# ========================================
smoother_server:
  ros__parameters:
    use_sim_time: False
    
    # Частота сглаживания
    smoother_frequency: 20.0
    
    # ===== ПЛАГИНЫ - CONSTRAINED SMOOTHER ДЛЯ ПЛАВНОСТИ! =====
    smoother_plugins: ["ConstrainedSmoother"]
    
    ConstrainedSmoother:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"  # ИСПРАВЛЕНО! Слэш вместо ::
      
      # ===== ПАРАМЕТРЫ СГЛАЖИВАНИЯ =====
      reversing_enabled: false
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      
      # ===== ОГРАНИЧЕНИЯ СКОРОСТИ =====
      minimum_turning_radius: 0.20
      
      # ===== ПАРАМЕТРЫ ОПТИМИЗАЦИИ =====
      w_curve: 30.0
      w_dist: 0.0
      w_smooth: 30000.0
      w_cost: 0.015
      
      # ===== ИТЕРАЦИИ =====
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5.0e-10
        fn_tol: 1.0e-15
        param_tol: 1.0e-20
# ========================================
#   BEHAVIOR SERVER - ВОССТАНОВЛЕНИЕ
# ========================================
behavior_server:
  ros__parameters:
    use_sim_time: False
    
    # Топики costmap
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    
    # Частота и фреймы
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    
    # Симуляция движения
    simulate_ahead_time: 2.0
    
    # Лимиты движения
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
    
    # Плагины поведений
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.6
      min_rotational_vel: 0.3
      rotational_acc_lim: 1.5
      
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
      backup_dist: 0.25
      backup_speed: 0.15
      time_allowance: 10.0
      
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      
    wait:
      plugin: "nav2_behaviors::Wait"

# ========================================
#    WAYPOINT FOLLOWER - ТОЧКИ МАРШРУТА
# ========================================
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    
    # Параметры следования
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 10.0
    
    # Плагины задач
    waypoint_task_executor_plugin: "wait_at_waypoint"
    
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ========================================
#   VELOCITY SMOOTHER - СГЛАЖИВАНИЕ CMD_VEL
# ========================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    
    # Частота и режим
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # Топики
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_smoothed"
    odom_topic: "/odom"
    odom_duration: 0.1
    
    # Лимиты скоростей [x, y, theta]
    max_velocity: [0.30, 0.0, 0.8]
    min_velocity: [-0.01, 0.0, -0.8]
    
    # Ускорения [x, y, theta]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-2.0, 0.0, -2.0]
    
    # Мертвая зона
    deadband_velocity: [0.01, 0.0, 0.02]
    
    # Таймаут
    velocity_timeout: 0.2

# ========================================
#   COLLISION MONITOR - БЕЗОПАСНОСТЬ
# ========================================
collision_monitor:
  ros__parameters:
    use_sim_time: False
    
    # Фреймы
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    
    # Топики
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    
    # Параметры безопасности
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 0.1
    
    # Зоны безопасности
    polygons: ["StopZone", "SlowdownZone"]
    
    # Зона экстренной остановки
    StopZone:
      type: "circle"
      action_type: "stop"
      radius: 0.06
      visualize: True
      enabled: True
      min_points: 8
      
    # Зона замедления
    SlowdownZone:
      type: "circle"
      action_type: "slowdown"
      radius: 0.12
      slowdown_ratio: 0.8
      visualize: True
      enabled: True
      min_points: 3
    
    # Источники данных
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True

# ========================================
#     MAP SERVER - СЕРВЕР КАРТЫ
# ========================================
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

# ========================================
#    LIFECYCLE MANAGERS - УПРАВЛЕНИЕ
# ========================================

# Менеджер локализации
lifecycle_manager_localization:
  ros__parameters:
    autostart: True
    node_names:
      - map_server
      - amcl

# Менеджер навигации
lifecycle_manager_navigation:
  ros__parameters:
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor

# =====================================================================
#                        КОНЕЦ КОНФИГУРАЦИИ
# =====================================================================